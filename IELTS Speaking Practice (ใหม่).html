<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Speaking Practice</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f3;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#c2410c;--acx:#fff;--bd:#e4e2da}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#f0efe9;--mu:#a3a39b;--ac:#fb923c;--acx:#1a1a18;--bd:#3a3a36}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#f0efe9;--mu:#a3a39b;--ac:#fb923c;--acx:#1a1a18;--bd:#3a3a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Sarabun,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 8px}
.card ul{margin:6px 0 0;padding-left:20px}
.mu{color:var(--mu);font-size:14px}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.rec{background:#dc2626;color:#fff;border-color:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
audio{width:100%;margin-top:10px}
.band{font-size:44px;font-weight:800;color:var(--ac);line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.grid div{border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.grid b{display:block;font-size:20px}
.tx{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px;max-height:140px;overflow:auto}
</style></head><body><main>
<h1>🎤 IELTS Speaking Practice</h1>
<div class="tabs" id="tabs"></div>
<div class="card"><div id="topic"></div>
<div class="row" style="margin-top:12px"><button class="btn pri" id="rnd">🎲 สุ่มหัวข้อใหม่</button><button class="btn" id="prep" style="display:none">⏳ เตรียมตัว 1 นาที</button></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><div><div class="timer" id="tm">00:00</div><div class="mu" id="tgt"></div></div>
<button class="btn pri" id="rec">● เริ่มอัดเสียง</button></div>
<audio id="au" controls style="display:none"></audio><div class="mu" id="msg" style="margin-top:8px"></div></div>
<div class="card" id="res" style="display:none"></div>
<p class="mu">คะแนนเป็นการ “ประมาณ” จากข้อความที่ระบบถอดเสียง (ความเร็วพูด, คำฟุ่มเฟือย, ความหลากหลายคำ, โครงสร้างประโยค, ความชัดของเสียง) ไม่ใช่คะแนนจริงของ IELTS ใช้เปรียบเทียบพัฒนาการของตัวเอง แนะนำให้ใช้ Chrome</p>
</main>
<script>
const P1=[["Hometown",["Where is your hometown?","What do you like most about it?","Has it changed much in recent years?","Would you recommend it to tourists?"]],
["Work or Studies",["Do you work or are you a student?","Why did you choose this job or subject?","What is the most interesting part of it?","Would you like to change it in the future?"]],
["Food",["What kind of food do you like?","Do you cook at home?","Has your diet changed since you were a child?","What is a traditional dish in your country?"]],
["Hobbies",["What do you do in your free time?","Did you have different hobbies as a child?","Do you prefer doing hobbies alone or with others?","Is there a hobby you want to try?"]],
["Technology",["How often do you use your phone?","What apps do you use most?","Do you think people depend too much on technology?","How has technology changed your daily life?"]],
["Weather",["What is the weather like in your city?","What kind of weather do you like?","Does weather affect your mood?","Do you check the forecast every day?"]],
["Travel",["Do you like travelling?","Where did you go on your last trip?","Do you prefer traveling alone or in a group?","Where would you like to go next?"]],
["Music",["What music do you listen to?","Do you play any instrument?","Has your taste in music changed?","Do you enjoy going to live concerts?"]],
["Family",["Do you have a big family?","Who are you closest to in your family?","What do you usually do together?","Do you think family is more important than friends?"]],
["Friends",["Do you have many friends?","How do you usually meet new people?","What makes a good friend?","Do you keep in touch with old friends?"]],
["Home",["Do you live in a house or an apartment?","What is your favourite room?","Would you like to move in the future?","How could you make your home better?"]],
["Shopping",["Do you enjoy shopping?","Do you prefer online or in-store shopping?","What was the last thing you bought?","Do you usually plan what to buy?"]],
["Transport",["How do you usually get to work or school?","Is public transport good in your city?","Do you prefer driving or being a passenger?","How could traffic be improved?"]],
["Sports and Exercise",["Do you play any sports?","Did you do more sport as a child?","Do you prefer exercising alone or in a team?","Is sport popular in your country?"]],
["Reading",["Do you enjoy reading?","What kind of books do you like?","Do you prefer paper books or e-books?","Did you read more when you were younger?"]],
["Sleep and Daily Routine",["What is your daily routine like?","What time do you usually go to bed?","Are you a morning person?","What would you change about your routine?"]]];
const P2=[
{t:"Describe a person who has influenced you.",b:["who this person is","how you know them","what they did","and explain why they influenced you"],q:["What qualities make someone a good role model?","Do children learn more from parents or teachers?","Are celebrities good role models today?"]},
{t:"Describe a place you visited that you really liked.",b:["where it is","when you went there","what you did there","and explain why you liked it"],q:["Why do people like to travel abroad?","Does tourism harm or help local communities?","How might travel change in the future?"]},
{t:"Describe a useful skill you learned.",b:["what the skill is","when and how you learned it","who helped you","and explain why it is useful"],q:["Which skills should schools teach?","Is it better to learn skills online or in a classroom?","Will some skills become unnecessary in the future?"]},
{t:"Describe a piece of technology you use often.",b:["what it is","how long you have had it","what you use it for","and explain why it is important to you"],q:["How has technology changed the way people communicate?","Do older people find technology harder to use?","Should children limit their screen time?"]},
{t:"Describe a memorable meal you had.",b:["where you had it","who you were with","what you ate","and explain why it was memorable"],q:["Why are family meals important?","Is fast food becoming more popular? Why?","How can people be encouraged to eat healthily?"]},
{t:"Describe a time when you helped someone.",b:["who you helped","what the problem was","how you helped","and explain how you felt about it"],q:["Why do some people volunteer?","Should helping others be taught at school?","Is it the government's or individuals' job to help the poor?"]},
{t:"Describe a book or film that made an impression on you.",b:["what it is about","when you read or saw it","who recommended it","and explain why it impressed you"],q:["Do people read less than in the past?","Can films influence society's opinions?","Are e-books better than paper books?"]},
{t:"Describe a goal you want to achieve in the future.",b:["what the goal is","when you want to achieve it","what you need to do","and explain why it matters to you"],q:["Why is it important to set goals?","Should young people plan their careers early?","What makes some people more determined than others?"]},
{t:"Describe a time when you were very busy.",b:["when it was","what you had to do","why you were so busy","and explain how you felt about it"],q:["Do people today have enough free time?","How can people manage their time better?","Is being busy always a bad thing?"]},
{t:"Describe a public place you enjoy going to.",b:["where it is","how often you go there","what you do there","and explain why you like it"],q:["Why are public spaces important in cities?","Should governments build more parks?","How do public places bring people together?"]},
{t:"Describe a gift you gave or received.",b:["what the gift was","who it was for or from","what the occasion was","and explain why it was special"],q:["Why do people give gifts on special occasions?","Are handmade gifts better than bought ones?","Has gift giving changed over time?"]},
{t:"Describe a difficult decision you made.",b:["what the decision was","when you made it","what made it difficult","and explain what happened afterwards"],q:["Should people make decisions alone or ask for advice?","Are young people good at making decisions?","How do decisions affect a person's future?"]},
{t:"Describe an event in your country that people celebrate.",b:["what the event is","when it takes place","what people do","and explain why it is important"],q:["Are traditional festivals still important today?","Do celebrations bring families closer?","Should festivals be shared with tourists?"]},
{t:"Describe a healthy habit you have.",b:["what the habit is","when you started it","how often you do it","and explain how it benefits you"],q:["Why do some people find it hard to stay healthy?","Who should teach children healthy habits?","Is healthcare the government's responsibility?"]},
{t:"Describe a building you find interesting.",b:["where it is","what it looks like","what it is used for","and explain why you find it interesting"],q:["Should old buildings be preserved or replaced?","How does architecture affect people's mood?","What makes a city attractive to live in?"]},
{t:"Describe a teacher who taught you something important.",b:["who the teacher was","what they taught you","how they taught","and explain why it was important"],q:["What makes a good teacher?","Will technology replace teachers one day?","Is school the best place to learn life skills?"]}];
const $=id=>document.getElementById(id);
let part=1,cur=null,mr=null,sr=null,chunks=[],tInt=null,t0=0,fin="",confs=[],recording=false,pInt=null;
const TARGET={1:20,2:90,3:30};
const TIT={1:"Part 1 · สัมภาษณ์",2:"Part 2 · พูดคนเดียว (Cue Card)",3:"Part 3 · อภิปราย"};
$("tabs").innerHTML=[1,2,3].map(p=>`<button data-p="${p}">Part ${p}</button>`).join("");
$("tabs").onclick=e=>{const p=e.target.dataset.p;if(p){part=+p;pick()}};
$("rnd").onclick=pick;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function pick(){
 if(recording)return;
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",+b.dataset.p===part));
 $("prep").style.display=part===2?"":"none";clearInterval(pInt);
 let h=`<div class="mu">${TIT[part]}</div>`;
 if(part===1){cur=rnd(P1);h+=`<h2>Topic: ${cur[0]}</h2><ul>${cur[1].map(q=>`<li>${q}</li>`).join("")}</ul>`}
 else if(part===2){cur=rnd(P2);h+=`<h2>${cur.t}</h2><div class="mu">You should say:</div><ul>${cur.b.map(q=>`<li>${q}</li>`).join("")}</ul>`}
 else{const c=rnd(P2);cur=c;h+=`<h2>Discussion</h2><div class="mu">Theme: ${c.t.replace("Describe ","")}</div><ul>${c.q.map(q=>`<li>${q}</li>`).join("")}</ul>`}
 $("topic").innerHTML=h;
 $("tgt").textContent=part===2?"เป้าหมาย: พูด 1–2 นาที":part===1?"เป้าหมาย: ตอบข้อละ ~20–30 วินาที":"เป้าหมาย: ตอบข้อละ ~30–45 วินาที";
 $("tm").textContent="00:00";$("au").style.display="none";$("res").style.display="none";$("msg").textContent="";
}
$("prep").onclick=()=>{clearInterval(pInt);let s=60;const f=()=>{$("tm").textContent="เตรียม "+fmt(s);if(s--<=0){clearInterval(pInt);$("tm").textContent="00:00";$("msg").textContent="หมดเวลาเตรียม เริ่มพูดได้เลย!"}};f();pInt=setInterval(f,1000)};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
$("rec").onclick=async()=>{recording?stop():await start()};
async function start(){
 clearInterval(pInt);
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];fin="";confs=[];
  mr=new MediaRecorder(st);mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:mr.mimeType});$("au").src=URL.createObjectURL(b);$("au").style.display="block"};
  mr.start();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){sr=new SR();sr.lang="en-US";sr.continuous=true;sr.interimResults=false;
   sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){fin+=" "+e.results[i][0].transcript;confs.push(e.results[i][0].confidence)}};
   sr.onend=()=>{if(recording)try{sr.start()}catch(_){}};sr.start()}
  else $("msg").textContent="เบราว์เซอร์นี้ไม่รองรับการถอดเสียง จึงประเมินคะแนนไม่ได้ (อัดฟังได้ปกติ)";
  recording=true;t0=Date.now();$("rec").textContent="■ หยุดอัด";$("rec").className="btn rec";$("res").style.display="none";
  tInt=setInterval(()=>$("tm").textContent=fmt(Math.floor((Date.now()-t0)/1000)),250);
 }catch(e){$("msg").textContent="เปิดไมค์ไม่ได้ (รหัสข้อผิดพลาด: "+(e&&e.name||"unknown")+") ถ้าเป็น NotAllowedError หรือ TypeError แปลว่าหน้านี้ถูกบล็อกไมค์ในกรอบที่ฝังอยู่ ลองเปิดเป็นไฟล์ในเครื่องหรือแท็บแยกแทน"}
}
function stop(){
 recording=false;clearInterval(tInt);const sec=(Date.now()-t0)/1000;
 mr.stop();if(sr)sr.stop();
 $("rec").textContent="● อัดอีกครั้ง";$("rec").className="btn pri";
 setTimeout(()=>show(analyze(fin.trim(),sec)),700);
}
const r5=x=>Math.round(Math.min(8.5,Math.max(4,x))*2)/2;
function analyze(text,sec){
 const w=text.toLowerCase().match(/[a-z']+/g)||[];const n=w.length;
 if(n<8)return{err:"ถอดเสียงได้น้อยเกินไป ลองพูดให้ดังและนานขึ้น (อย่างน้อยประมาณ 10 คำ)",text};
 const wpm=n/(sec/60);
 const fill=w.filter(x=>["um","uh","er","erm","hmm","ah"].includes(x)).length+(text.toLowerCase().match(/you know|kind of|sort of|i mean/g)||[]).length;
 let F=wpm>=120?7:wpm>=100?6.5:wpm>=80?6:wpm>=60?5.5:wpm>=40?5:4.5;
 F-=Math.min(1,fill/n*8);
 const ratio=sec/TARGET[part];F-=ratio<0.5?1:ratio<0.8?0.5:0;
 const u=new Set(w).size,rt=u/Math.sqrt(n),long=w.filter(x=>x.length>=8).length/n;
 const L=4.5+Math.min(2,Math.max(0,(rt-3.5)*0.5))+Math.min(1.5,long*9);
 const low=text.toLowerCase();
 const conn=(low.match(/\b(because|although|though|however|while|whereas|which|who|if|when|since|so that|therefore|actually|besides|instead|unless|even though)\b/g)||[]).length;
 const adv=/\b(have been|has been|had been|would have|used to|was going to|if i were|i would)\b/.test(low)?0.5:0;
 const G=5+Math.min(1.5,conn/n*100*0.25)+adv+(n/Math.max(1,fin.split(/[.?!]/).length)>12?0:0);
 const c=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:null;
 const P=c===null?6:c>=.92?7.5:c>=.88?7:c>=.82?6.5:c>=.75?6:c>=.65?5.5:5;
 const s={F:r5(F),L:r5(L),G:r5(G),P:r5(P)};
 const o=Math.round(((s.F+s.L+s.G+s.P)/4)*2)/2;
 const weak=Object.entries(s).sort((a,b)=>a[1]-b[1])[0][0];
 const tips={F:"พูดต่อเนื่องและยาวขึ้น ลดคำอึกอัก (um/uh) ใช้วลีเช่น “Well, let me think…” แทนการเงียบ",L:"ใช้คำหลากหลายขึ้น ลองใช้ collocation และคำเหมือน แทนการซ้ำคำเดิม",G:"ใช้ประโยคซับซ้อนมากขึ้น เช่น because / although / if… และผสม tense ให้หลากหลาย",P:"พูดให้ชัดขึ้น เน้นเสียงหนักเบาและจังหวะ ลองฟังเสียงที่อัดแล้วเทียบกับเจ้าของภาษา"};
 return{o,s,n,wpm:Math.round(wpm),fill,sec:Math.round(sec),tip:tips[weak],text,noConf:c===null};
}
function show(r){
 const el=$("res");el.style.display="block";
 if(r.err){el.innerHTML=`<h2>ผลลัพธ์</h2><p>${r.err}</p>${r.text?`<div class="tx">${r.text}</div>`:""}`;return}
 el.innerHTML=`<div class="mu">Band โดยประมาณ</div><div class="band">${r.o.toFixed(1)}</div><div class="mu">ช่วงที่เป็นไปได้ ${(r.o-.5).toFixed(1)} – ${Math.min(9,r.o+.5).toFixed(1)}</div>
 <div class="grid"><div>Fluency<b>${r.s.F.toFixed(1)}</b></div><div>Lexical<b>${r.s.L.toFixed(1)}</b></div><div>Grammar<b>${r.s.G.toFixed(1)}</b></div><div>Pronunciation<b>${r.s.P.toFixed(1)}</b></div></div>
 <p class="mu">${r.n} คำ · ${r.wpm} คำ/นาที · คำอึกอัก ${r.fill} · ${r.sec} วินาที</p>
 <p>💡 ${r.tip}</p><div class="mu">สิ่งที่ระบบได้ยิน:</div><div class="tx">${r.text}</div>`;
}
pick();
</script></body></html>
